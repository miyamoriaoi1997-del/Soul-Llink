# ─── Fallback principle signals ──────────────────────────────────────────────
# When no term list matches, these lightweight heuristics add signals to the
# default decision so transition_manager can make better hold/release choices.
fallback_principles:
  # Contextual reference markers — suggest the message refers to prior context
  contextual_reference:
    - 那个
    - 这个
    - 它
    - 刚才
    - 上面
    - 之前
    - 前面
    - 刚刚
    - 上次
    - 那边

  # Question intent markers — suggest the message is asking something
  question_markers:
    - 吗
    - 呢
    - 么
    - ？
    - ?

  # Emotional tone markers — suggest relationship/emotional content
  emotional_markers:
    - 啊
    - 呀
    - 哦
    - 嘛
    - 哈
    - 嗯
    - 唔
    - 喂
    - 哼
    - 嘿

  # Confidence boost when contextual reference detected (added to default_daily)
  contextual_boost: 0.08
  # Confidence boost for question intent
  question_boost: 0.05
