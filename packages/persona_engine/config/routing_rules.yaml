# ═══════════════════════════════════════════════════════════════════════════════
# Persona State Machine — Routing Rules Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# All term lists and thresholds for mode classification and transition logic.
# Edit this file to add/remove terms without touching Python code.
# Run `python scripts/eval_state_machine.py` after changes to verify accuracy.
#
# Term format:
#   - Simple string: "term"
#   - Weighted: { term: "term", weight: 0.7 }
#   - Context-gated: { term: "term", requires_context: ["other_term"] }
#   - Combined: { term: "term", weight: 0.7, requires_context: ["x"] }
#
# Weight defaults to 1.0 if omitted. requires_context means the term only
# counts if at least one context term is also present in the message.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Confidence values for classifier decisions ───────────────────────────────
confidence:
  meta_discussion: 0.86
  persona_system: 0.90
  creative_generation: 0.80
  creative_review: 0.82
  financial_trading: 0.88
  system_maintenance: 0.90
  crisis: 0.90
  relationship_rupture: 0.92
  explicit_sex: 0.90
  sex_hint: 0.82
  technical_work: 0.88
  intimacy: 0.78
  creative_task: 0.76
  default_daily: 0.55

# ─── Transition thresholds ────────────────────────────────────────────────────
thresholds:
  anti_flap_confidence: 0.65
  work_override_confidence: 0.75
  short_message_max_chars: 4
  sex_hold_work_confidence: 0.75

