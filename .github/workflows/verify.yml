name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: PYTHONPATH=".:packages/persona_engine:packages:adapters" uv run pytest -q packages/persona_engine/tests
      - name: Remove test-generated audit artifacts
        run: |
          rm -rf packages/persona_engine/logs
          rm -f logs/persona_orchestrator_shadow.jsonl logs/persona_orchestrator_shadow.jsonl.lock
      - run: uv run python scripts/public_release_audit.py --root .
      - run: uv build
