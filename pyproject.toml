[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soullink-public"
version = "2.3.0"
description = "Open public reference runtime for persona, memory/context governance, and model routing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SoulLink Public contributors" },
]
keywords = [
    "agent-runtime",
    "context-governance",
    "memory-governance",
    "model-routing",
    "persona-runtime",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
soullink = "pcltm.cli:main"
pcltm = "pcltm.cli:main"
soullink-continuity-gate = "pcltm.continuity_gate:main"
soullink-host-adapt = "soul_link.host_adaptation:main"
soullink-hermes-deploy = "soul_link.hermes_deploy:main"
soullink-hermes-update = "soul_link.hermes_update:main"
soullink-codex-deploy = "soul_link.codex_deploy:main"
soullink-codex-mcp = "soul_link.codex_mcp:main"
soullink-codex-hook = "soul_link.codex_hook:main"
soullink-zcode-deploy = "soul_link.zcode_deploy:main"
soullink-zcode-mcp = "soul_link.zcode_mcp:main"
soullink-zcode-hook = "soul_link.zcode_hook:main"
soullink-zcode-observer = "soul_link.zcode_observer:main"
soullink-zcode-history = "pcltm.zcode_history:main"

[project.urls]
Homepage = "https://github.com/miyamoriaoi1997-del/Soul-Llink"
Repository = "https://github.com/miyamoriaoi1997-del/Soul-Llink"
Issues = "https://github.com/miyamoriaoi1997-del/Soul-Llink/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=9.0.0",
    "ruff>=0.12,<1",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[tool.setuptools]
include-package-data = false
packages = [
    "soul_link",
    "soul_link.hermes_plugin",
    "soul_link.hermes_assets",
    "soul_link.hermes_assets.memory",
    "soul_link.hermes_assets.context",
    "soul_link.integration",
    "pcltm",
    "pcltm.injection",
    "pcltm.memory",
    "pcltm.monitoring",
    "pcltm.monitoring.static",
    "pcltm.persona",
    "pcltm.procedural",
    "pcltm.projections",
    "pcltm.session",
    "pcltm.state",
    "persona_engine",
    "persona_engine.persona_orchestrator",
    "persona_engine.persona_orchestrator.context_router",
    "persona_engine.scripts",
    "model_router",
]

[tool.setuptools.package-dir]
soul_link = "soul_link"
"soul_link.hermes_plugin" = "soul_link/hermes_plugin"
"soul_link.hermes_assets" = "soul_link/hermes_assets"
"soul_link.hermes_assets.memory" = "soul_link/hermes_assets/memory"
"soul_link.hermes_assets.context" = "soul_link/hermes_assets/context"
"soul_link.integration" = "soul_link/integration"
pcltm = "packages/pcltm"
"pcltm.injection" = "packages/pcltm/injection"
"pcltm.memory" = "packages/pcltm/memory"
"pcltm.monitoring" = "packages/pcltm/monitoring"
"pcltm.monitoring.static" = "packages/pcltm/monitoring/static"
"pcltm.persona" = "packages/pcltm/persona"
"pcltm.procedural" = "packages/pcltm/procedural"
"pcltm.projections" = "packages/pcltm/projections"
"pcltm.session" = "packages/pcltm/session"
"pcltm.state" = "packages/pcltm/state"
persona_engine = "packages/persona_engine"
"persona_engine.persona_orchestrator" = "packages/persona_engine/persona_orchestrator"
"persona_engine.persona_orchestrator.context_router" = "packages/persona_engine/persona_orchestrator/context_router"
"persona_engine.scripts" = "packages/persona_engine/scripts"
model_router = "packages/model_router"

[tool.setuptools.package-data]
"soul_link.hermes_assets.memory" = ["plugin.yaml"]
"soul_link.hermes_assets.context" = ["plugin.yaml"]
"pcltm.monitoring.static" = ["*.html", "*.js", "*.css"]
persona_engine = [
    "config/*.yaml",
    "soul_layers/*.md",
    "*.template.md",
]
model_router = [
    "*.yaml",
    "*.service",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages", "adapters"]
