host: hermes-agent
adapter_version: "1"
patch: patches/pcltm-context-engine-host-adapter.patch
required_paths:
  - agent/agent_init.py
  - agent/context_engine.py
  - agent/conversation_compression.py
  - agent/turn_context.py
  - hermes_cli/plugins_cmd.py
  - plugins/context_engine/pcltm-context/__init__.py
  - tests/hermes_cli/test_plugins_cmd.py
  - tests/run_agent/test_plugin_context_engine_init.py
  - tests/run_agent/test_run_agent.py
created_paths:
  - tests/agent/test_context_request_budget.py
  - tests/agent/test_pcltm_context_budget.py
verify_commands:
  - ["{python}", -m, pytest, tests/agent/test_context_request_budget.py, tests/agent/test_pcltm_context_budget.py, tests/hermes_cli/test_plugins_cmd.py, tests/run_agent/test_plugin_context_engine_init.py, "tests/run_agent/test_run_agent.py::TestMemoryProviderTurnStart::test_on_turn_start_forwards_turn_context", -q]
